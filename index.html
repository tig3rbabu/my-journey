<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Equilateral Balance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;700&display=swap');
        body { background: #020406; color: #f8fafc; font-family: 'Inter', sans-serif; touch-action: manipulation; }
        
        /* Sacred Geometry */
        .white-line { stroke: #fff; stroke-width: 0.6; fill: none; opacity: 0.2; }
        .psy-circle { stroke-width: 1; fill: none; animation: chroma 12s infinite linear; }
        @keyframes chroma { 0% { stroke: #ff00ff; } 50% { stroke: #00ffff; } 100% { stroke: #ff00ff; } }
        
        .flare-bloom { transition: fill 0.4s; filter: blur(15px); opacity: 0.3; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; }
        
        .icon-light, .icon-shadow { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            transition: opacity 0.4s ease, stroke 0.4s ease, fill 0.4s ease;
            stroke-width: 1.5; 
            fill-opacity: 0.3;
        }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-runnable-track { height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; background: #fff; margin-top: -8px; border: 2px solid #020406; box-shadow: 0 0 12px rgba(255,255,255,0.4); }
        
        .hidden { display: none; }
        .tab-active { color: #10b981; border-bottom: 2px solid #10b981; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <main id="page-home" class="flex-1 flex flex-col items-center p-4 pb-28">
        <div class="relative w-full max-w-sm aspect-square my-6">
            <svg viewBox="0 0 100 100" class="w-full h-full overflow-visible">
                
                <!-- Equilateral Triangle Geometry -->
                <!-- Top: (50, 15.7), Bottom Left: (10, 85), Bottom Right: (90, 85) -->
                <polygon points="50,15.7 90,85 10,85" class="white-line" />
                
                <!-- Inner Phasing Circle (Centered at Triangle Centroid 50, 61.9) -->
                <circle cx="50" cy="61.9" r="24" class="psy-circle" />

                <!-- Inverted Pentagram (Tips touching the circle) -->
                <path d="M50,85.9 L36.5,43.3 L72.8,69.5 L27.2,69.5 L63.5,43.3 Z" class="white-line" />

                <!-- Nodes -->
                <!-- Triangle Vertices -->
                <g id="n-assets"><circle cx="50" cy="15.7" r="10" class="flare-bloom"/><foreignObject x="44" y="8" width="12" height="12"><div class="relative w-full h-full"><i data-lucide="coins" class="icon-light"></i><i data-lucide="flame" class="icon-shadow"></i></div></foreignObject></g>
                <g id="n-serotonin"><circle cx="10" cy="85" r="10" class="flare-bloom"/><foreignObject x="4" y="78" width="12" height="12"><div class="relative w-full h-full"><i data-lucide="atom" class="icon-light"></i><i data-lucide="skull" class="icon-shadow"></i></div></foreignObject></g>
                <g id="n-health"><circle cx="90" cy="85" r="10" class="flare-bloom"/><foreignObject x="84" y="78" width="12" height="12"><div class="relative w-full h-full"><i data-lucide="activity" class="icon-light"></i><i data-lucide="heart-off" class="icon-shadow"></i></div></foreignObject></g>

                <!-- Pentagram Vertices (Clockwise starting from Top Left) -->
                <g id="n-nic"><circle cx="36.5" cy="43.3" r="8" class="flare-bloom"/><foreignObject x="32.5" y="38" width="8" height="8"><div class="relative w-full h-full"><i data-lucide="hourglass" class="icon-light"></i><i data-lucide="wind" class="icon-shadow"></i></div></foreignObject></g>
                <g id="n-mj"><circle cx="63.5" cy="43.3" r="8" class="flare-bloom"/><foreignObject x="59.5" y="38" width="8" height="8"><div class="relative w-full h-full"><i data-lucide="music" class="icon-light"></i><i data-lucide="cloud" class="icon-shadow"></i></div></foreignObject></g>
                <g id="n-alc"><circle cx="72.8" cy="69.5" r="8" class="flare-bloom"/><foreignObject x="74" y="66" width="8" height="8"><div class="relative w-full h-full"><i data-lucide="coffee" class="icon-light"></i><i data-lucide="glass-water" class="icon-shadow"></i></div></foreignObject></g>
                <g id="n-food"><circle cx="50" cy="85.9" r="8" class="flare-bloom"/><foreignObject x="46" y="88" width="8" height="8"><div class="relative w-full h-full"><i data-lucide="utensils" class="icon-light"></i><i data-lucide="pizza" class="icon-shadow"></i></div></foreignObject></g>
                <g id="n-bull"><circle cx="27.2" cy="69.5" r="8" class="flare-bloom"/><foreignObject x="18" y="66" width="8" height="8"><div class="relative w-full h-full"><i data-lucide="snowflake" class="icon-light"></i><i data-lucide="zap" class="icon-shadow"></i></div></foreignObject></g>

                <!-- Centered Yin Yang -->
                <g transform="translate(50, 61.9) scale(0.12)"><circle r="100" fill="#fff"/><path d="M 0,-100 A 100,100 0 0,1 0,100 A 50,50 0 0,1 0,0 A 50,50 0 0,0 0,-100" fill="#000"/></g>
            </svg>
        </div>

        <div class="w-full max-w-md space-y-4 px-2">
            <div class="glass p-5 space-y-7"><input type="range" id="in-assets" oninput="updateUI()" onchange="logSnapshot()"><input type="range" id="in-serotonin" oninput="updateUI()" onchange="logSnapshot()"><input type="range" id="in-health" oninput="updateUI()" onchange="logSnapshot()"></div>
            <div class="glass p-5 space-y-7"><input type="range" id="in-nic" oninput="updateUI()" onchange="logSnapshot()"><input type="range" id="in-mj" oninput="updateUI()" onchange="logSnapshot()"><input type="range" id="in-alc" oninput="updateUI()" onchange="logSnapshot()"><input type="range" id="in-food" oninput="updateUI()" onchange="logSnapshot()"><input type="range" id="in-bull" oninput="updateUI()" onchange="logSnapshot()"></div>
        </div>
    </main>

    <main id="page-stats" class="hidden flex-1 p-6 pb-28 overflow-y-auto">
        <div class="glass p-4 mb-4"><canvas id="mainChart"></canvas></div>
        <div class="flex gap-2 mb-6">
            <button onclick="exportData()" class="flex-1 glass p-3 text-[10px] uppercase font-bold tracking-widest text-emerald-400">Backup</button>
            <button onclick="importData()" class="flex-1 glass p-3 text-[10px] uppercase font-bold tracking-widest text-blue-400">Restore</button>
        </div>
        <div id="stats-list" class="space-y-3"></div>
    </main>

    <nav class="fixed bottom-0 w-full bg-black/90 backdrop-blur-md border-t border-white/5 flex justify-around p-5">
        <button onclick="showPage('home')" id="nav-home" class="tab-active text-[10px] uppercase font-bold tracking-widest">Symbol</button>
        <button onclick="showPage('stats')" id="nav-stats" class="text-slate-500 text-[10px] uppercase font-bold tracking-widest">Analytics</button>
    </nav>

    <script>
        const KEYS = ['assets', 'serotonin', 'health', 'nic', 'mj', 'alc', 'food', 'bull'];
        let myChart = null;

        function getFaderColor(p) {
            let r, g;
            if (p < 50) { r = 255; g = Math.round((p / 50) * 165); } 
            else { r = Math.round(255 - ((p - 50) / 50) * 255); g = Math.round(165 + ((p - 50) / 50) * 90); }
            return `rgb(${r},${g},0)`;
        }

        function updateUI() {
            KEYS.forEach(key => {
                const val = document.getElementById(`in-${key}`).value;
                const color = getFaderColor(val);
                const group = document.getElementById(`n-${key}`);
                group.querySelector('.flare-bloom').style.fill = color;
                const light = group.querySelector('.icon-light');
                const shadow = group.querySelector('.icon-shadow');
                const lightOpacity = val / 100;
                const shadowOpacity = 1 - (val / 100);
                light.style.opacity = lightOpacity;
                shadow.style.opacity = shadowOpacity;
                light.style.stroke = color; light.style.fill = color;
                shadow.style.stroke = color; shadow.style.fill = color;
                light.style.fillOpacity = 0.1 + (lightOpacity * 0.4);
                shadow.style.fillOpacity = 0.1 + (shadowOpacity * 0.4);
            });
            const state = {};
            KEYS.forEach(k => state[k] = document.getElementById(`in-${k}`).value);
            localStorage.setItem('sovereign_equi_v5', JSON.stringify(state));
        }

        function logSnapshot() {
            const history = JSON.parse(localStorage.getItem('sovereign_history_v5') || '[]');
            const snap = { t: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) };
            KEYS.forEach(k => snap[k] = document.getElementById(`in-${k}`).value);
            history.push(snap);
            if(history.length > 50) history.shift();
            localStorage.setItem('sovereign_history_v5', JSON.stringify(history));
        }

        function renderChart() {
            const history = JSON.parse(localStorage.getItem('sovereign_history_v5') || '[]');
            const ctx = document.getElementById('mainChart').getContext('2d');
            if(myChart) myChart.destroy();
            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: history.map(h => h.t),
                    datasets: KEYS.map(k => ({
                        data: history.map(h => h[k]),
                        borderColor: getFaderColor(history[history.length-1]?.[k] || 50),
                        borderWidth: 2, pointRadius: 0, tension: 0.4
                    }))
                },
                options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { display: false } } }
            });
        }

        function exportData() {
            const data = { state: localStorage.getItem('sovereign_equi_v5'), history: localStorage.getItem('sovereign_history_v5') };
            prompt("SAVE THIS CODE:", btoa(JSON.stringify(data)));
        }

        function importData() {
            const str = prompt("PASTE BACKUP CODE:");
            if (str) {
                try {
                    const data = JSON.parse(atob(str));
                    localStorage.setItem('sovereign_equi_v5', data.state);
                    localStorage.setItem('sovereign_history_v5', data.history);
                    location.reload();
                } catch(e) { alert("Error"); }
            }
        }

        function showPage(p) {
            document.getElementById('page-home').classList.toggle('hidden', p !== 'home');
            document.getElementById('page-stats').classList.toggle('hidden', p !== 'stats');
            document.getElementById('nav-home').classList.toggle('tab-active', p === 'home');
            document.getElementById('nav-stats').classList.toggle('tab-active', p === 'stats');
            if(p === 'stats') renderChart();
        }

        lucide.createIcons();
        const saved = JSON.parse(localStorage.getItem('sovereign_equi_v5') || '{"assets":50,"serotonin":50,"health":50,"nic":50,"mj":50,"alc":50,"food":50,"bull":50}');
        KEYS.forEach(k => document.getElementById(`in-${k}`).value = saved[k]);
        setTimeout(updateUI, 100);
    </script>
</body>
</html>
